<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>純日式職人美甲 - 智慧迎賓看板</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        .container {
            width: 92%;
            max-width: 850px;
            padding: 40px 20px;
            border-radius: 20px;
            background: rgba(22, 22, 22, 0.95);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            border: 1px solid #333;
            transition: all 0.5s ease;
        }
        /* 優化標題排版，避免手機窄螢幕斷行難看 */
        .normal-ad h1 {
            font-size: clamp(1.5rem, 5vw, 2.4rem);
            color: #d4af37;
            margin-bottom: 15px;
            letter-spacing: 1px;
            font-weight: 500;
            white-space: nowrap; /* 強制不斷行，保持精緻 */
        }
        .normal-ad p {
            font-size: clamp(0.95rem, 2.8vw, 1.3rem);
            color: #aaa;
            line-height: 1.6;
            margin: 8px 0;
        }
        .welcome-box h1 {
            font-size: clamp(1.8rem, 6vw, 2.8rem);
            color: #ffb74d;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .welcome-box p {
            font-size: clamp(1rem, 3vw, 1.4rem);
            color: #fff;
            line-height: 1.6;
            margin: 8px 0;
        }
        /* iOS 聲音解鎖按鈕樣式 */
        #soundUnlockBtn {
            margin-top: 20px;
            background: #d4af37;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }
        #webcam, #debugInfo {
            display: none;
        }
    </style>
</head>
<body>

    <video id="webcam" autoplay playsinline muted></video>
    <div id="debugInfo">動態感應中...</div>

    <div class="container" id="displayBox">
        <div class="normal-ad">
            <h1>✨ 日本留學・純日式美學</h1>
            <p>日本正統沙龍技術 ｜ 專屬您的細緻美甲訂製空間</p>
            <p style="font-size: 0.9rem; color: #666; letter-spacing: 1px;">— 講究的職人手作，溫柔綻放 —</p>
        </div>
    </div>

    <!-- 解決 iPhone 聲音限制的解鎖按鈕 -->
    <button id="soundUnlockBtn" onclick="unlockAudio()">🔊 點擊此處啟動語音迎賓</button>

    <script>
        const video = document.getElementById('webcam');
        const displayBox = document.getElementById('displayBox');
        const debugInfo = document.getElementById('debugInfo');
        const soundUnlockBtn = document.getElementById('soundUnlockBtn');
        let lastState = "normal";
        let noMotionTimer = null;
        let audioUnlocked = false;

        // 點擊按鈕解鎖 iOS 語音權限
        function unlockAudio() {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance("語音系統已啟動");
                utterance.volume = 0; // 靜默測試解鎖
                window.speechSynthesis.speak(utterance);
                audioUnlocked = true;
                soundUnlockBtn.style.display = 'none'; // 隱藏按鈕，畫面變乾淨
                console.log("iOS 音訊已成功解鎖");
            }
        }

        navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } })
            .then(stream => {
                video.srcObject = stream;
                video.play();
                requestAnimationFrame(detectMotion);
            })
            .catch(err => {
                console.log("相機啟用失敗: ", err);
            });

        const canvas = document.createElement('canvas');
        canvas.width = 160;
        canvas.height = 120;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let prevData = null;

        function detectMotion() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const currData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

                if (prevData) {
                    let diffSum = 0;
                    for (let i = 0; i < currData.length; i += 20) {
                        diffSum += Math.abs(currData[i] - prevData[i]);
                    }

                    if (diffSum > 200000) { 
                        triggerWelcome();
                    }
                }
                prevData = currData;
            }
            setTimeout(() => {
                requestAnimationFrame(detectMotion);
            }, 250);
        }

        function speakWelcome() {
            if ('speechSynthesis' in window && audioUnlocked) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance("歡迎光臨正統日式美學，請稍坐休息，我們馬上為您服務。");
                utterance.lang = 'zh-TW';
                utterance.rate = 1.0;
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            }
        }

        function triggerWelcome() {
            if (lastState !== "welcome") {
                lastState = "welcome";
                speakWelcome();
                displayBox.innerHTML = `
                    <div class="welcome-box">
                        <h1>✨ いらっしゃいませ 歡迎光臨！</h1>
                        <p>美甲師正在為貴賓進行正統日式服務中<br>請先稍坐片刻，參觀桌上日本直送色卡與精緻款式 ✨</p>
                        <p style="color: #f1c40f; font-size: 1.1rem; margin-top: 10px;">💡 新客預約日式指定款，享專屬職人禮遇！</p>
                    </div>
                `;
                displayBox.style.borderColor = "#d4af37";
            }

            clearTimeout(noMotionTimer);
            noMotionTimer = setTimeout(() => {
                lastState = "normal";
                displayBox.innerHTML = `
                    <div class="normal-ad">
                        <h1>✨ 日本留學・純日式美學</h1>
                        <p>日本正統沙龍技術 ｜ 專屬您的細緻美甲訂製空間</p>
                        <p style="font-size: 0.9rem; color: #666; letter-spacing: 1px;">— 講究的職人手作，溫柔綻放 —</p>
                    </div>
                `;
                displayBox.style.borderColor = "#333";
            }, 6000);
        }
    </script>
</body>
</html>
