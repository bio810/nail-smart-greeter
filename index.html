<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指尖微奢藝術 - 智慧語音迎賓看板</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        .container {
            width: 85%;
            max-width: 850px;
            padding: 60px 40px;
            border-radius: 24px;
            background: rgba(20, 20, 20, 0.9);
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            border: 1px solid #333;
            transition: all 0.5s ease;
        }
        .normal-ad h1 {
            font-size: 3.2rem;
            color: #d4af37;
            margin-bottom: 20px;
            letter-spacing: 3px;
        }
        .normal-ad p {
            font-size: 1.6rem;
            color: #aaa;
            line-height: 1.6;
        }
        .welcome-box h1 {
            font-size: 3.5rem;
            color: #ffb74d;
            margin-bottom: 20px;
        }
        .welcome-box p {
            font-size: 1.7rem;
            color: #fff;
            line-height: 1.7;
        }
        /* 為了方便測試，我們把鏡頭畫面縮小放在畫面上方角落，確認它有在運作 */
        #webcam {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 80px;
            height: 60px;
            border: 2px solid #d4af37;
            border-radius: 8px;
            z-index: 999;
            object-fit: cover;
        }
        /* 數值除錯框 */
        #debugInfo {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #888;
            font-size: 14px;
            background: rgba(0,0,0,0.8);
            padding: 5px 15px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <!-- 顯示縮小的攝影機畫面，確保手機有成功啟動鏡頭 -->
    <video id="webcam" autoplay playsinline muted></video>

    <!-- 除錯數值顯示 -->
    <div id="debugInfo">相機初始化中...</div>

    <div class="container" id="displayBox">
        <div class="normal-ad">
            <h1>✨ 指尖上的微奢藝術</h1>
            <p>日韓精緻手繪 ｜ 專屬您的美甲訂製空間<br><span style="font-size: 1.2rem; color: #666;">— 讓美麗，在指尖溫柔綻放 —</span></p>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const displayBox = document.getElementById('displayBox');
        const debugInfo = document.getElementById('debugInfo');
        let lastState = "normal";
        let noMotionTimer = null;

        // 1. 強制啟動相機
        navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } })
            .then(stream => {
                video.srcObject = stream;
                video.play();
                debugInfo.innerText = "相機已啟動，請在鏡頭前揮手";
                requestAnimationFrame(detectMotion);
            })
            .catch(err => {
                console.log("相機啟用失敗: ", err);
                debugInfo.innerText = "相機權限被拒絕或不支援！";
                alert("無法啟動相機，請檢查瀏覽器權限！");
            });

        const canvas = document.createElement('canvas');
        canvas.width = 160;   // 降低解析度以加快運算
        canvas.height = 120;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let prevData = null;

        function detectMotion() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const currData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

                if (prevData) {
                    let diffSum = 0;
                    for (let i = 0; i < currData.length; i += 20) {
                        diffSum += Math.abs(currData[i] - prevData[i]);
                    }

                    // 即時在下方顯示當前數值
                    debugInfo.innerText = `動態感應值: ${Math.floor(diffSum)} (觸發門檻: 100000)`;

                    // 降低門檻到 100,000 讓輕微揮手就能觸發
                    if (diffSum > 100000) { 
                        triggerWelcome();
                    }
                }
                prevData = currData;
            }
            setTimeout(() => {
                requestAnimationFrame(detectMotion);
            }, 250);
        }

        function speakWelcome() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance("歡迎光臨！請稍坐休息，我們馬上為您服務。");
                utterance.lang = 'zh-TW';
                utterance.rate = 1.0;
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            }
        }

        function triggerWelcome() {
            if (lastState !== "welcome") {
                lastState = "welcome";
                speakWelcome();
                displayBox.innerHTML = `
                    <div class="welcome-box">
                        <h1>👋 歡迎光臨！</h1>
                        <p>美甲師正在為貴賓服務中<br>請先稍坐休息，或參觀桌上最新色卡與款式靈感 ✨<br><span style="color: #f1c40f; font-size: 1.3rem;">💡 新客預約指定款，享專屬質感優惠！</span></p>
                    </div>
                `;
                displayBox.style.borderColor = "#d4af37";
            }

            clearTimeout(noMotionTimer);
            noMotionTimer = setTimeout(() => {
                lastState = "normal";
                displayBox.innerHTML = `
                    <div class="normal-ad">
                        <h1>✨ 指尖上的微奢藝術</h1>
                        <p>日韓精緻手繪 ｜ 專屬您的美甲訂製空間<br><span style="font-size: 1.2rem; color: #666;">— 讓美麗，在指尖溫柔綻放 —</span></p>
                    </div>
                `;
                displayBox.style.borderColor = "#333";
            }, 6000);
        }
    </script>
</body>
</html>
