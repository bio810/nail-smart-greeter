<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指尖微奢藝術 - 智慧語音迎賓看板</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        .container {
            width: 85%;
            max-width: 850px;
            padding: 60px 40px;
            border-radius: 24px;
            background: rgba(20, 20, 20, 0.9);
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            border: 1px solid #333;
            transition: all 0.5s ease;
        }
        /* 常態廣告風格（平時質感輪播） */
        .normal-ad h1 {
            font-size: 3.2rem;
            color: #d4af37; /* 質感金 */
            margin-bottom: 20px;
            letter-spacing: 3px;
        }
        .normal-ad p {
            font-size: 1.6rem;
            color: #aaa;
            line-height: 1.6;
        }
        /* 互動歡迎風格（有人靠近時的暖心招呼） */
        .welcome-box h1 {
            font-size: 3.5rem;
            color: #ffb74d;
            margin-bottom: 20px;
            animation: fadeInDown 0.4s ease;
        }
        .welcome-box p {
            font-size: 1.7rem;
            color: #fff;
            line-height: 1.7;
            animation: fadeInUp 0.4s ease;
        }
        /* 隱藏式感應鏡頭 */
        #webcam {
            position: absolute;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0.01;
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 隱藏的攝影機串流，在背景靜靜幫忙感應人影 -->
    <video id="webcam" autoplay playsinline muted></video>

    <div class="container" id="displayBox">
        <div class="normal-ad">
            <h1>✨ 指尖上的微奢藝術</h1>
            <p>日韓精緻手繪 ｜ 專屬您的美甲訂製空間<br><span style="font-size: 1.2rem; color: #666;">— 讓美麗，在指尖溫柔綻放 —</span></p>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const displayBox = document.getElementById('displayBox');
        let lastState = "normal";
        let noMotionTimer = null;

        // 1. 啟動前鏡頭進行感應
        navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } })
            .then(stream => {
                video.srcObject = stream;
                video.play();
                requestAnimationFrame(detectMotion);
            })
            .catch(err => {
                console.log("相機啟用失敗: ", err);
                alert("請點擊允許相機權限，智慧語音迎賓看板才能正常運作喔！");
            });

        // 2. 建立像素比對畫布
        const canvas = document.createElement('canvas');
        canvas.width = 320;
        canvas.height = 240;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let prevData = null;

        function detectMotion() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const currData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

                if (prevData) {
                    let diffSum = 0;
                    // 抽樣比對畫面差異
                    for (let i = 0; i < currData.length; i += 40) {
                        diffSum += Math.abs(currData[i] - prevData[i]);
                    }

                    // 感應門檻（可依現場環境微調數值）
                    if (diffSum > 1500000) { 
                        triggerWelcome();
                    }
                }
                prevData = currData;
            }
            // 每秒執行約 5 次檢查，順暢且不耗效能
            setTimeout(() => {
                requestAnimationFrame(detectMotion);
            }, 200);
        }

        // 3. 語音朗讀函式
        function speakWelcome() {
            if ('speechSynthesis' in window) {
                // 如果正在說話則先打斷，確保聲音即時
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance("歡迎光臨！請稍坐休息，我們馬上為您服務。");
                utterance.lang = 'zh-TW'; // 設定為台灣繁體中文語系
                utterance.rate = 1.0;   // 語速 (1.0 為正常速度)
                utterance.pitch = 1.1;  // 音調稍微微調，聽起來更親切溫柔
                
                window.speechSynthesis.speak(utterance);
            }
        }

        // 觸發暖心迎賓畫面與語音
        function triggerWelcome() {
            if (lastState !== "welcome") {
                lastState = "welcome";
                
                // 播放語音招呼
                speakWelcome();

                displayBox.innerHTML = `
                    <div class="welcome-box">
                        <h1>👋 歡迎光臨！</h1>
                        <p>美甲師正在為貴賓服務中<br>請先稍坐休息，或參觀桌上最新色卡與款式靈感 ✨<br><span style="color: #f1c40f; font-size: 1.3rem;">💡 新客預約指定款，享專屬質感優惠！</span></p>
                    </div>
                `;
                displayBox.style.borderColor = "#d4af37";
            }

            clearTimeout(noMotionTimer);
            
            // 當客人離開或沒有動作滿 6 秒後，自動切回常態廣告
            noMotionTimer = setTimeout(() => {
                lastState = "normal";
                displayBox.innerHTML = `
                    <div class="normal-ad">
                        <h1>✨ 指尖上的微奢藝術</h1>
                        <p>日韓精緻手繪 ｜ 專屬您的美甲訂製空間<br><span style="font-size: 1.2rem; color: #666;">— 讓美麗，在指尖溫柔綻放 —</span></p>
                    </div>
                `;
                displayBox.style.borderColor = "#333";
            }, 6000);
        }
    </script>
</body>
</html>
